[project]
name = "drug-unit-converter"
version = "0.1.0"
description = "Convert drug claim quantities between NDC (NCPDP) units and HCPCS billing units using public CMS/FDA data."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "network: tests that download live public files (deselect with -m 'not network')",
]
